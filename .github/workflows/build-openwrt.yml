name: Build FanchmWrt TR3000-256M (OP25.12 + MTK 闭源驱动)

on:
  push:
    branches:
      - 'fanchmwrt-*'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: '上传构建产物'
        required: false
        default: 'true'

permissions:
  contents: read

env:
  # 目标设备配置文件名（configs/ 下）
  DEVICE_CONFIG: cudy_tr3000-256mb-v1.config
  # 产物输出目录
  OUTPUT_DIR: bin/targets/mediatek/filogic

jobs:
  build:
    name: Build TR3000 256M
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 磁盘空间清理
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -qq clean
          echo "=== 清理后 ==="
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-dev rsync subversion swig time \
            unzip zlib1g-dev file wget curl ccache libelf-dev

      - name: 准备 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: 配置 ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --zero-stats || true

      - name: 更新 feeds（GitHub 镜像加速）
        run: |
          # feeds.conf.default 已指向 GitHub 官方镜像（commit 与 git.openwrt.org 一致）
          ./scripts/feeds update -a

      - name: 应用 feeds_patches（构建期文件覆盖）
        run: |
          set -e
          if [ -d feeds_patches ]; then
            count=0
            while IFS= read -r f; do
              rel="${f#feeds_patches/}"
              feed="${rel%%/*}"
              path="${rel#*/}"
              if [ -d "feeds/$feed" ]; then
                mkdir -p "feeds/$feed/$(dirname "$path")"
                cp -f "$f" "feeds/$feed/$path"
                echo "  覆盖 feeds/$feed/$path"
                count=$((count + 1))
              else
                echo "  [跳过] feed '$feed' 不存在: $f"
              fi
            done < <(find feeds_patches -type f)
            echo "共覆盖 $count 个文件"
          else
            echo "无 feeds_patches 目录"
          fi

      - name: 安装 feeds
        run: ./scripts/feeds install -a

      - name: 应用设备配置
        run: |
          if [ ! -f "configs/${DEVICE_CONFIG}" ]; then
            echo "::error::配置文件 configs/${DEVICE_CONFIG} 不存在"
            exit 1
          fi
          cp "configs/${DEVICE_CONFIG}" .config
          # 补全依赖（只新增依赖项，不覆盖显式选择）
          make defconfig
          echo "=== 关键选型确认 ==="
          grep -E "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y|CONFIG_PACKAGE_kmod-mt_wifi=y|CONFIG_MTK_FIRST_IF_MT7981=y|CONFIG_PACKAGE_luci-compat=y|CONFIG_PACKAGE_luci-theme-argon=y|CONFIG_PACKAGE_luci-theme-aurora=y|CONFIG_PACKAGE_luci-app-Airpifanctrl=y|CONFIG_PACKAGE_luci-app-mwrt-catcage=y" .config || true
          echo "=== 确认开源 mt76 未启用 ==="
          grep -E "CONFIG_PACKAGE_kmod-mt7915e=y|CONFIG_PACKAGE_kmod-mt76-core=y" .config && echo "::warning::检测到开源 mt76 仍被启用" || echo "OK: 开源 mt76 未启用"

      - name: 下载依赖包
        run: |
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; || true

      - name: 编译固件
        run: |
          echo "并行任务数: $(nproc)"
          make -j$(nproc) || make -j1 V=s
        env:
          CCACHE_DIR: ~/.ccache

      - name: ccache 统计
        if: always()
        run: ccache --show-stats || true

      - name: 收集产物
        run: |
          mkdir -p artifacts
          if [ -d "${OUTPUT_DIR}" ]; then
            find "${OUTPUT_DIR}" -maxdepth 1 -type f \
              \( -name "*sysupgrade.bin" -o -name "*factory.bin" -o -name "*.manifest" \
                 -o -name "sha256sums" -o -name "profiles.json" \) \
              -exec cp -v {} artifacts/ \;
          fi
          echo "=== 产物清单 ==="
          ls -lh artifacts/ || true

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-tr3000-256m-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: 构建日志（失败时）
        if: failure()
        run: |
          echo "=== 编译失败，收集诊断信息 ==="
          find . -name "*.log" -path "*build_dir*" -newer .config 2>/dev/null | head -20 || true
          ls -la logs/ 2>/dev/null || true
