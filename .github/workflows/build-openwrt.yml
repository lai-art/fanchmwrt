name: Build FanchmWrt TR3000-256M (OP25.12 + MTK 闭源驱动)

on:
  push:
    branches:
      - 'fanchmwrt-*'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: '上传构建产物'
        required: false
        default: 'true'

permissions:
  contents: write   # 失败日志外送需要写入 build-logs 分支

# 同一分支只保留最新一次构建: 新推送直接取消在跑的那次。
# 否则多个 run 并发写 build-logs 分支, 日志会互相覆盖, 排查时无法确定日志属于哪个 commit。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 目标设备配置文件名（configs/ 下）
  DEVICE_CONFIG: cudy_tr3000-256mb-v1.config
  # 产物输出目录
  OUTPUT_DIR: bin/targets/mediatek/filogic

jobs:
  build:
    name: Build TR3000 256M
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 磁盘空间清理
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -qq clean
          echo "=== 清理后 ==="
          df -h /

      - name: 安装编译依赖
        run: |
          set -e
          sudo apt-get update
          # 注意: Ubuntu 24.04 已移除 python3-distutils; gcc-multilib 仅 x86 有意义, 目标为 aarch64 不需要
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev libelf-dev liblzma-dev \
            python3 python3-setuptools python3-dev \
            rsync subversion swig time patch \
            unzip zip bzip2 xz-utils zstd xsltproc \
            zlib1g-dev file wget curl ccache cmake
          # gcc-14 只用于「编译标志预检」: 交叉工具链是 GCC 14.3, 宿主机默认
          # 却是 13.x, 用 13 校验 -Wno-error=return-mismatch 会误判。装不上就算了。
          sudo apt-get install -y --no-install-recommends gcc-14 || true
          echo "=== 工具自检 ==="
          for t in gcc g++ make python3 rsync unzip patch ccache cmake; do
            printf '%-10s ' "$t"
            command -v "$t" >/dev/null && "$t" --version 2>&1 | head -1 || echo "缺失!"
          done

      - name: 准备 ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: 配置 ccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --zero-stats || true

      - name: 更新 feeds（GitHub 镜像）
        run: |
          # feeds.conf.default 使用 GitHub 官方镜像 + 与上游一致的 commit 固定
          ./scripts/feeds update -a

      - name: 应用 feeds_patches（构建期文件覆盖）
        run: |
          set -e
          if [ -d feeds_patches ]; then
            count=0
            while IFS= read -r f; do
              rel="${f#feeds_patches/}"
              feed="${rel%%/*}"
              path="${rel#*/}"
              if [ -d "feeds/$feed" ]; then
                mkdir -p "feeds/$feed/$(dirname "$path")"
                cp -f "$f" "feeds/$feed/$path"
                echo "  覆盖 feeds/$feed/$path"
                count=$((count + 1))
              else
                echo "  [跳过] feed '$feed' 不存在: $f"
              fi
            done < <(find feeds_patches -type f)
            echo "共覆盖 $count 个文件"
          else
            echo "无 feeds_patches 目录"
          fi

      - name: 安装 feeds
        run: ./scripts/feeds install -a

      - name: 应用设备配置
        run: |
          if [ ! -f "configs/${DEVICE_CONFIG}" ]; then
            echo "::error::配置文件 configs/${DEVICE_CONFIG} 不存在"
            exit 1
          fi
          cp "configs/${DEVICE_CONFIG}" .config
          # 补全依赖（只新增依赖项，不覆盖显式选择）
          make defconfig

      - name: 配置自检
        run: |
          OUT=/tmp/config_check.txt
          : > "$OUT"
          log() { echo "$@"; echo "$@" >> "$OUT"; }
          log "=== 关键选型硬校验 ==="
          fail=0
          for c in \
            CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1 \
            CONFIG_PACKAGE_kmod-mt_wifi \
            CONFIG_MTK_FIRST_IF_MT7981 \
            CONFIG_PACKAGE_luci-compat \
            CONFIG_PACKAGE_luci-theme-argon \
            CONFIG_PACKAGE_luci-theme-aurora \
            CONFIG_PACKAGE_luci-app-mwrt-catcage \
            CONFIG_PACKAGE_luci-app-Airpifanctrl ; do
            if grep -qx "${c}=y" .config; then
              log "  OK   $c"
            else
              log "  FAIL $c   <-- 关键选型缺失"
              fail=1
            fi
          done
          log ""
          log ""
          log "=== MTK 驱动关键配置 (缺一即功能残缺或编不过) ==="
          for c in \
            CONFIG_MTK_WIFI_FW_BIN_LOAD \
            CONFIG_MTK_WIFI_BASIC_FUNC \
            CONFIG_MTK_SUPPORT_OPENWRT \
            CONFIG_MTK_CHIP_MT7981 \
            CONFIG_MTK_DOT11_HE_AX ; do
            if grep -qE "^${c}=(y|m)$" .config; then
              log "  OK   $c"
            else
              log "  FAIL $c   <-- MTK 驱动关键配置缺失"
              fail=1
            fi
          done
          # tristate, 允许 y 或 m
          if grep -qE "^CONFIG_MTK_MT_AP_SUPPORT=(y|m)$" .config; then
            log "  OK   CONFIG_MTK_MT_AP_SUPPORT"
          else
            log "  FAIL CONFIG_MTK_MT_AP_SUPPORT   <-- AP 模式驱动不会被编译"
            fail=1
          fi
          # warp 是 int/string 型配置, 必须逐项比对取值。
          # 注意: MTK_WARP_V2 依赖 MTK_WHNAT_SUPPORT -> MTK_FAST_NAT_SUPPORT -> HNAT 包,
          # 25.12 树内已无 HNAT(ra_sw_nat_hook_tx 无实现), 故 MTK_WARP_V2 必须为 n,
          # 不能作为门禁项。真正决定 warp 编译分支的是 WARP_VERSION / WARP_CHIPSET。
          if grep -qx "CONFIG_WARP_VERSION=2" .config; then
            log "  OK   CONFIG_WARP_VERSION=2"
          else
            log "  FAIL CONFIG_WARP_VERSION != 2 (filogic 下 default 取不到值, 会错编成 MT7988 的 V3)"
            fail=1
          fi
          if grep -qE '^CONFIG_WARP_CHIPSET="mt7981"$' .config; then
            log "  OK   CONFIG_WARP_CHIPSET=mt7981"
          else
            log "  FAIL CONFIG_WARP_CHIPSET != mt7981 (default 是 mt7988)"
            fail=1
          fi
          if grep -qx "CONFIG_MTK_WHNAT_SUPPORT=y" .config; then
            log "  FAIL CONFIG_MTK_WHNAT_SUPPORT=y   <-- 树内无 HNAT 实现, 必然链接失败"
            fail=1
          else
            log "  OK   CONFIG_MTK_WHNAT_SUPPORT 已关闭 (树内无 HNAT)"
          fi

          log ""
          log "=== 内核 -Werror 必须关闭 (MTK 闭源驱动按 6.6 编写) ==="
          if grep -qx "CONFIG_KERNEL_WERROR=y" .config; then
            log "  FAIL CONFIG_KERNEL_WERROR=y  (toolchain/gcc/Config.version 的 imply 又把它打开了)"
            fail=1
          else
            log "  OK: CONFIG_KERNEL_WERROR 已关闭"
          fi

          log "=== 开源 mt76 关闭确认 ==="
          if grep -qE "^CONFIG_PACKAGE_kmod-(mt76|mt7915e|mt7981-firmware)=y" .config; then
            grep -E "^CONFIG_PACKAGE_kmod-(mt76|mt7915e|mt7981-firmware)=y" .config | tee -a "$OUT"
            log "  FAIL 开源 mt76 仍被启用"
            fail=1
          else
            log "  OK: 无开源 mt76 相关包"
          fi
          log ""
          log "=== 配置中请求但被 defconfig 丢弃的包 ==="
          drop=0
          fatal=0
          for p in $(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "configs/${DEVICE_CONFIG}" | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//'); do
            if ! grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
              log "  DROP $p"
              grep -E "^CONFIG_PACKAGE_${p}=" .config | sed 's/^/       现状: /' | tee -a "$OUT"
              drop=$((drop + 1))
              # 翻译包缺失不阻断编译(只影响该语言文案), 其余任何缺失都算功能缺失
              case "$p" in
                luci-i18n-*) log "       (翻译包, 不阻断构建)" ;;
                *) fatal=$((fatal + 1)) ;;
              esac
            fi
          done
          log "共丢弃 ${drop} 项, 其中阻断性 ${fatal} 项"

          # 丢弃时给出候选符号名, 避免再去猜包名
          if [ "$drop" -gt 0 ] && [ -f tmp/.config-package.in ]; then
            log ""
            log "=== 候选符号(供修正包名) ==="
            log "--- luci-i18n-base 中 en/de/zh 系 ---"
            grep -oE "config PACKAGE_luci-i18n-base-[A-Za-z0-9_-]+" tmp/.config-package.in \
              | sed -E 's/^config //' | grep -iE "zh|_en|en$|de$" | sort -u | tee -a "$OUT"
            log "--- PACKAGE_luci-i18n-base-zh-cn 的 Kconfig 上下文 ---"
            grep -A10 -B2 "config PACKAGE_luci-i18n-base-zh-cn" tmp/.config-package.in | tee -a "$OUT"
            log "--- .config 中 luci-base 现状 ---"
            grep -E "^CONFIG_PACKAGE_luci-base=" .config | tee -a "$OUT"
          fi
          # 任何被丢弃的非翻译包都意味着某项功能缺失, 直接失败, 便于在 5 分钟内定位
          [ "$fatal" -eq 0 ] || fail=1
          log "=== 自检结果: fail=${fail} ==="
          [ "$fail" -eq 0 ]

      # GCC 对未知的 -Wno-error=NAME 是硬错误, 不是警告:
      #   error: '-Wno-error=macro-redefined': no option '-Wmacro-redefined'
      # 一个拼错的标志会让整个包连一个 .c 都不编译就失败, 而发现它要等 40 分钟。
      # 宿主机 gcc 逐个试一遍, 秒级自爆。
      - name: 编译标志预检
        run: |
          set +e
          : > /tmp/flag_check.txt
          # 宿主机默认 gcc 是 13.x, 而 OpenWrt 25.12 的交叉 gcc 是 14.3。
          # return-mismatch / declaration-missing-parameter-type 都是 GCC 14 新增
          # 的警告名(此前无名或含在 -Wreturn-type 里), 用 13 校验会误判成非法,
          # 所以优先用 gcc-14, 实在没有就对这两个名字跳过校验。
          CCBIN=$(command -v gcc-14 || command -v gcc)
          MAJOR=$($CCBIN -dumpversion 2>/dev/null | cut -d. -f1)
          echo "校验用编译器: $CCBIN (版本 ${MAJOR:-?})"
          bad=0
          for f in $(find package/mtk target/linux/mediatek -name 'Makefile*' -type f 2>/dev/null); do
            for w in $(grep -oE '\-W(no-)?error=[A-Za-z0-9_-]+' "$f" \
                       | sed -E 's/^-W(no-)?error=//' | sort -u); do
              case "$w" in
                return-mismatch|declaration-missing-parameter-type)
                  if [ "${MAJOR:-0}" -lt 14 ]; then
                    echo "SKIP $f : -Wno-error=$w (GCC14 新增项, 当前校验器不认识, 无法判定)" \
                      | tee -a /tmp/flag_check.txt
                    continue
                  fi ;;
              esac
              echo 'int main(void){return 0;}' > /tmp/t.c
              if ! $CCBIN "-Wno-error=$w" -c /tmp/t.c -o /tmp/t.o 2>/tmp/t.err; then
                { echo "FAIL $f : -Wno-error=$w"
                  sed -n '1,2p' /tmp/t.err; } | tee -a /tmp/flag_check.txt
                bad=$((bad + 1))
              fi
            done
          done
          if [ "$bad" -eq 0 ]; then
            echo "=== 编译标志全部合法 ==="
          else
            echo "::error::发现 $bad 个非法编译标志 (见 flag_check.txt)"
          fi
          [ "$bad" -eq 0 ]

      - name: 下载依赖包
        run: |
          make download -j8 || make download -j1 V=s
          echo "=== 怀疑下载不完整的文件 (<1KB) ==="
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true

      - name: 内核补丁预检
        run: |
          set +e
          # 注意: OpenWrt 没有 target/linux/configure 这个目标 (只有
          # prepare / compile / install), 之前误用它会直接 "No rule to make target"。
          # 这里只做两件快事:
          #   1) 编 tools —— target/linux/prepare 依赖 $(STAGING_DIR_HOST)/bin/patch,
          #      那是 tools/patch 的产物, 单跑 target 目标不会自动带上。
          #   2) 跑 prepare —— 解压内核 + 按序应用 generic/pending -> hack
          #      -> target/patches, 我们新加的 970 补丁能否干净应用, 这一步就能判定。
          # prepare 成功后 world 会复用 stamp, 不重复劳动。
          make tools/compile V=s > /tmp/prep_tools.log 2>&1
          echo "tools/compile rc=$?"
          make target/linux/prepare V=s > /tmp/kernel_prep.log 2>&1
          rc=$?
          echo "target/linux/prepare rc=$rc"
          echo "=== 预检日志尾部 ==="
          tail -45 /tmp/kernel_prep.log
          if [ $rc -ne 0 ]; then
            echo "!! 内核准备阶段失败 (补丁应用或解压出错), 见 kernel_prep_tail.txt"
            exit 1
          fi
          echo "=== 970 补丁是否已应用到内核源码 ==="
          KC=$(find build_dir -maxdepth 4 -type f -path "*linux-filogic*/linux-*/net/wireless/Kconfig" 2>/dev/null | head -1)
          echo "内核 Kconfig: ${KC:-<未找到>}"
          if [ -n "$KC" ]; then
            grep -A2 -m1 "^config WIRELESS_EXT" "$KC" | sed 's/^/  /'
            if grep -A1 -m1 "^config WIRELESS_EXT" "$KC" | grep -q 'bool "Wireless extensions"'; then
              echo "  OK  WIRELESS_EXT 已带 prompt, 可在 target config 中选中"
            else
              echo "  FAIL WIRELESS_EXT 仍是裸 bool, 970 补丁未生效"
              exit 1
            fi
          fi

      - name: 编译固件
        id: build
        run: |
          echo "并行任务数: $(nproc)"
          # 后台记录资源曲线: 内核并行编译最容易磁盘满或 OOM, 而这两者
          # 在 make 日志里往往只表现为一句无上下文的失败。
          ( while true; do
              echo "--- $(date -u +%H:%M:%S)"
              df -h / | tail -1
              free -m | sed -n '2p'
              sleep 120
            done ) > /tmp/resmon.log 2>&1 &
          MON=$!
          # V=s: world 在默认等级下会把 target/linux 子 make 的输出整个吞掉,
          # 内核失败时日志里只剩一句 "target/linux failed to build", 无从定位。
          # -k: 遇错继续编译其它包。厂家代码是逐包适配的, 不加 -k 时 world 会在
          # 第一个失败包处停止启动新目标, 每 40~90 分钟只能暴露一个包的问题;
          # 加 -k 后一轮就能拿到全部失败包, 由下面的诊断步骤逐个 V=s 重编。
          make -j"$(nproc)" V=s -k > /tmp/make.log 2>&1
          rc=$?
          kill $MON 2>/dev/null || true
          echo "make 退出码: $rc"
          echo "日志大小: $(wc -c < /tmp/make.log) 字节 / $(wc -l < /tmp/make.log) 行"
          exit $rc
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: ccache 统计
        if: always()
        run: ccache --show-stats || true

      - name: 收集产物
        if: success()
        run: |
          mkdir -p artifacts
          if [ -d "${OUTPUT_DIR}" ]; then
            find "${OUTPUT_DIR}" -maxdepth 1 -type f \
              \( -name "*sysupgrade.bin" -o -name "*factory.bin" -o -name "*.manifest" \
                 -o -name "sha256sums" -o -name "profiles.json" \) \
              -exec cp -v {} artifacts/ \;
          fi
          echo "=== 产物清单 ==="
          ls -lh artifacts/ || true

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-tr3000-256m-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      # 失败时把日志推到 build-logs 分支，便于外部直接读取（Actions 日志端点需管理员权限）
      - name: 失败日志外送
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          D=/tmp/diag
          rm -rf "$D"; mkdir -p "$D/pkglogs"
          {
            echo "run_number=${{ github.run_number }}"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref_name }}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$D/run_info.txt"
          # V=s 的完整日志可达数百 MB, 整份塞进 git 会超 GitHub 单文件 100MB 限制,
          # 只保留尾部上下文 + 提取后的错误行。
          if [ -f /tmp/make.log ]; then
            tail -n 8000 /tmp/make.log > "$D/make_tail.log"
            ls -l /tmp/make.log | awk '{print "make.log 原始大小: "$5" 字节"}'
          fi
          [ -f /tmp/config_check.txt ] && cp -f /tmp/config_check.txt "$D/config_check.txt"
          [ -f /tmp/flag_check.txt ] && cp -f /tmp/flag_check.txt "$D/flag_check.txt"
          [ -f /tmp/kernel_prep.log ] && tail -n 2500 /tmp/kernel_prep.log > "$D/kernel_prep_tail.txt"
          [ -f /tmp/prep_tools.log ] && tail -n 400 /tmp/prep_tools.log > "$D/prep_tools_tail.txt"
          [ -f .config ] && cp -f .config "$D/dotconfig.txt"

          # 环境快照: 内核并行编译极易 OOM, 也常因磁盘满静默失败
          { echo "=== df -h ==="; df -h / /tmp 2>/dev/null; echo; echo "=== free -m ==="; free -m; echo; echo "=== nproc ==="; nproc; } > "$D/env.txt" 2>&1
          [ -f /tmp/resmon.log ] && tail -n 120 /tmp/resmon.log > "$D/resmon.txt"

          # 摘要: 原始日志里 Error N 后面没有冒号, 旧规则 "Error [0-9]+:" 从未命中
          if [ -f /tmp/make.log ]; then
            grep -nE "error:|undefined reference|No rule to make target|collect2:|fatal error|\*\*\* |ERROR: |Killed|No space left|Hunk .* FAILED|Patch failed" /tmp/make.log > "$D/errors.txt"
          fi

          # 编译进度摘要。
          # 只看 failed_packages.txt 很容易误判: 失败包只有一个, 并不代表其余包都
          # 编过了 —— world 在第一个失败处就会停止启动新目标(run#23 就是这种情况,
          # 4MB 日志里 package/mtk/drivers 下的三个包出现 0 次, mt_wifi 根本没编到)。
          # 这里把"真正编完的包"和"关键包是否被触及"明确写出来。
          {
            echo "=== 编完的包 (有 time: .../compile 统计行的) 共 $(grep -oE '^time: package/[^#]+/compile' /tmp/make.log 2>/dev/null | sort -u | wc -l) 个 ==="
            grep -oE '^time: package/[^#]+/compile' /tmp/make.log 2>/dev/null | sed 's|^time: ||; s|/compile$||' | sort -u
            echo
            echo "=== 关键包在日志中的出现次数 (0 = 本轮完全没被编译) ==="
            for p in package/mtk/drivers/conninfra package/mtk/drivers/warp \
                     package/mtk/drivers/mt_wifi package/mtk/applications; do
              echo "$(grep -c "$p" /tmp/make.log 2>/dev/null || echo 0)  $p"
            done
          } > "$D/progress.txt" 2>&1

          # target/linux(内核) 失败: 兜底。V=s 日志已能覆盖大部分情况,
          # 只有提取不到任何内核错误时才花 50 分钟重编。
          if grep -q "target/linux failed to build" /tmp/make.log 2>/dev/null; then
            KERR=$(wc -l < "$D/errors.txt" 2>/dev/null || echo 0)
            echo "=== 内核失败, V=s 日志中已提取错误行: $KERR ==="
            if [ "$KERR" -eq 0 ]; then
              echo "=== 日志无内核细节, V=sc 重编 target/linux ==="
              KLOG=/tmp/kernel_rebuild.log
              timeout 3300 make target/linux/compile V=sc -k -j"$(nproc)" > "$KLOG" 2>&1
              echo "  -> 内核重编日志 $(wc -c < "$KLOG") 字节"
              grep -nE "error:|Error [0-9]|fatal error|\*\*\* |Killed|No space left|Hunk .* FAILED|Patch failed|undefined reference|cannot find|No such file" "$KLOG" \
                | head -600 > "$D/kernel_errors.txt" 2>/dev/null || true
              tail -n 3000 "$KLOG" > "$D/pkglogs/kernel_tail.log" 2>/dev/null || true
            fi
            # 内核最终 .config, 用于比对 config-6.12 是否真的生效
            for c in build_dir/target-*/linux-filogic/linux-*/.config; do
              [ -f "$c" ] && cp -f "$c" "$D/kernel_dotconfig.txt" && break
            done
          fi

          # 找出失败的包, 每个用 V=s 单线程重编, 拿到真正的编译错误
          : > "$D/failed_packages.txt"
          if [ -f /tmp/make.log ]; then
            grep -oE "ERROR: package/[^ ]+ failed to build" /tmp/make.log \
              | sed -E 's/^ERROR: //; s/ failed to build$//' | sort -u > "$D/failed_packages.txt"
          fi
          # -k 之后一轮可能同时暴露十几个失败包, 而每个包 V=s 单线程重编最多
          # 要 20 分钟, job 总共只有 350 分钟。这里做两件事:
          #   1) 完整列表另存为 failed_packages_all.txt, 信息不丢;
          #   2) 重编清单优先排 mtk/drivers (mt_wifi 是 6.12 适配最大的未知数),
          #      其余按原顺序补齐, 总数上限 8 个。
          if [ -s "$D/failed_packages.txt" ]; then
            cp -f "$D/failed_packages.txt" "$D/failed_packages_all.txt"
            { grep "mtk/drivers" "$D/failed_packages.txt" || true
              grep -v "mtk/drivers" "$D/failed_packages.txt" || true
            } | awk '!u[$0]++' | head -8 > "$D/rebuild_list.txt"
            mv -f "$D/rebuild_list.txt" "$D/failed_packages.txt"
          fi
          echo "=== 全部失败包 ==="; cat "$D/failed_packages_all.txt" 2>/dev/null || true
          echo "=== 本轮将重编 ==="; cat "$D/failed_packages.txt"

          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            safe=$(printf '%s' "$pkg" | tr '/' '_')
            echo "=== 重编 $pkg (V=s) ==="
            # 先清掉该包的构建目录, 否则 make 会认为已完成
            timeout 300 make "$pkg/clean" V=s >/dev/null 2>&1
            # -k: make 遇错继续, 一次把该包所有编译错误都抓出来,
            # 避免每轮构建只能暴露一个错误、一轮一小时地往前挪。
            timeout 1200 make "$pkg/compile" V=s -j1 -k > "$D/pkglogs/rebuild_${safe}.log" 2>&1
            echo "  -> 日志 $(wc -c < "$D/pkglogs/rebuild_${safe}.log") 字节"
            # 同时保留 OpenWrt 自己写的编译日志
            for f in $(find logs -type f -path "*${pkg#package/}*" -name "*.txt" 2>/dev/null); do
              cp -f "$f" "$D/pkglogs/$(printf '%s' "$f" | tr '/' '_')"
            done
          done < "$D/failed_packages.txt"

          # ---- 下游包提前编译 ----
          # kmod-mt_wifi 依赖 kmod-conninfra / kmod-warp, 这两个包编译失败时
          # world 根本不会再尝试 mt_wifi。而 mt_wifi 恰好是 6.12 适配负担最重
          # 的一块(闭源驱动, 500+ 源文件, 大量按老内核写的条件编译), 结果是
          # 每轮 45 分钟的构建都停在同一个先决条件上, mt_wifi 的问题始终轮不到暴露。
          #
          # package/xxx/compile 不校验 DEPENDS(那是打包阶段的事), mt_wifi 也不
          # 依赖 conninfra/warp 的任何头文件或 .ko, 只要内核 build_dir 已 prepare
          # (run#19 起内核这一关已通过), 就可以独立编译。这里主动踢一脚,
          # 把它的编译错误和本次失败一并外送, 省掉一整轮等待。
          if grep -qE "mtk/drivers/(conninfra|warp)" "$D/failed_packages.txt" 2>/dev/null; then
            for pb in package/mtk/drivers/mt_wifi; do
              safe=$(printf '%s' "$pb" | tr '/' '_')
              echo "=== 提前编译下游包 $pb (忽略依赖失败) ==="
              timeout 2400 make "$pb/compile" V=s -j"$(nproc)" -k \
                > "$D/pkglogs/prebuild_${safe}.log" 2>&1
              echo "  -> 日志 $(wc -c < "$D/pkglogs/prebuild_${safe}.log") 字节"
            done
          fi

          echo "收集到文件:"; ls -lR "$D" | head -80

          cd "$D" || exit 0
          git init -q .
          git config user.email "ci@fanchmwrt.local"
          git config user.name "fanchmwrt-ci"
          git add -A
          git commit -qm "build #${{ github.run_number }} failure logs (run ${{ github.run_id }})" || exit 0
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/build-logs
